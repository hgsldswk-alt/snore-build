name: SnoreLog
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.snore
    APP_STORE_ID: __APP_STORE_ID__
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SnoreLog:
    type: application
    platform: iOS
    sources: [SnoreLog, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SnoreLog AppStore
    info:
      path: SnoreLog/Info.plist
      properties:
        CFBundleDisplayName: 鼾声记录
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: 用来在你睡觉时录下鼾声。录音只保存在这台 iPhone 上。
        NSPhotoLibraryAddUsageDescription: 仅用于把你选择保存的分享卡写入照片。
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        SnoreLogAppGroup: group.$(APP_ID)
        SnoreLogProProductID: $(APP_ID).pro
        SnoreLogTrialProductID: $(APP_ID).trial
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID)
            CFBundleURLSchemes: [snorelog]
    entitlements:
      path: SnoreLog/SnoreLog.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
    dependencies:
      - target: SnoreLogWidget
  SnoreLogWidget:
    type: app-extension
    platform: iOS
    sources: [SnoreLogWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: SnoreLog Widget AppStore
    info:
      path: SnoreLogWidget/Info.plist
      properties:
        CFBundleDisplayName: 鼾声记录
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SnoreLogAppGroup: group.$(APP_ID)
    entitlements:
      path: SnoreLogWidget/SnoreLogWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_ID)]
  SnoreLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SnoreLogTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  SnoreLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SnoreLogUITests]
    dependencies:
      - target: SnoreLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SnoreLog
schemes:
  SnoreLog:
    build:
      targets:
        SnoreLog: all
        SnoreLogTests: [test]
    test:
      config: Debug
      targets: [SnoreLogTests]
  SnoreLogUI:
    build:
      targets:
        SnoreLog: all
        SnoreLogUITests: [test]
    test:
      config: Debug
      targets: [SnoreLogUITests]
